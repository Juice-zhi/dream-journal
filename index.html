<!doctype html>
<html lang="zh-Hans">
<head>

  <title>梦境记录 · Dream Journal</title>
  <style>
    :root {
      --bg: #f6f4fb;
      --surface: #ffffff;
      --text: #1e1b2e;
      --muted: #575170;
      --accent: #5443b0;
      --border: #e2ddef;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0e22;
        --surface: #17162e;
        --text: #f1eefb;
        --muted: #c2bcd8;
        --accent: #bcaeff;
        --border: #2e2a52;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.7; font-size: 16px; }
    main { width: 100%; max-width: 560px; margin: 0 auto; padding: 56px 16px 40px; }
    h1 { font-size: 2rem; line-height: 1.25; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 28px; }
    a.card { display: block; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin: 12px 0; }
    a.card strong { color: var(--accent); display: block; font-size: 1.05rem; }
    a.card span { color: var(--muted); font-size: 0.95rem; }
    footer { color: var(--muted); font-size: 0.88rem; margin-top: 32px; }
  </style>
</head>
<body>
<main>
  <h1>梦境记录</h1>

  <a class="card" href="support.html#en" lang="en"><strong>Help &amp; Support</strong><span>FAQ and contact</span></a>
